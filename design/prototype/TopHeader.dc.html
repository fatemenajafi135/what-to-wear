<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-md);width:100%;box-sizing:border-box;">
  <div style="display:flex;align-items:center;gap:var(--space-md);min-width:0;flex:1;">
    <sc-if value="{{ hasBack }}" hint-placeholder-val="{{ true }}">
      <dc-import name="IconButton" icon="back" on-click="{{ onBack }}" hint-size="34px,34px"></dc-import>
    </sc-if>
    <div style="flex:1;min-width:0;">
      <h1 style="margin:0;font-size:var(--font-size-lg);font-weight:700;color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ title }}</h1>
      <sc-if value="{{ hasSubtitle }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:var(--font-size-xs);color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ subtitle }}</div>
      </sc-if>
    </div>
  </div>
  <sc-if value="{{ isRightIcon }}" hint-placeholder-val="{{ false }}">
    <dc-import name="IconButton" icon="{{ rightIcon }}" size="36" on-click="{{ onRightAction }}" hint-size="36px,36px"></dc-import>
  </sc-if>
  <sc-if value="{{ isRightPill }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ onRightAction }}" style-active="background:var(--color-border);" style-focus="box-shadow:var(--shadow-focus-ring);" style-after="content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);min-width:44px;min-height:44px;" style="position:relative;background:var(--color-surface-sunken);color:var(--color-primary);border:1px solid var(--color-border);border-radius:var(--radius-pill);padding:var(--space-sm) var(--space-md);font-size:var(--font-size-sm);font-weight:700;font-family:'Instrument Sans',sans-serif;cursor:pointer;flex-shrink:0;transition:background-color var(--motion-duration-fast) var(--motion-easing-standard);">{{ rightLabel }}</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:50},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Screen title&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onBack&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;rightType&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;icon&quot;,&quot;pill&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;rightIcon&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;settings&quot;,&quot;options&quot;:[&quot;settings&quot;,&quot;dots&quot;,&quot;filter&quot;,&quot;calendar&quot;,&quot;history&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;rightLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Edit&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onRightAction&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const rightType = this.props.rightType || 'none';
    return {
      title: this.props.title ?? '',
      hasSubtitle: !!this.props.subtitle, subtitle: this.props.subtitle ?? '',
      hasBack: !!this.props.onBack, onBack: this.props.onBack || (() => {}),
      isRightIcon: rightType === 'icon', isRightPill: rightType === 'pill',
      rightIcon: this.props.rightIcon || 'settings', rightLabel: this.props.rightLabel ?? '',
      onRightAction: this.props.onRightAction || (() => {})
    };
  }
}
</script>
</body>
</html>
