[project]
name = "whattowear-evals"
version = "0.1.0"
description = "Isolated RAGAS + LLM-as-judge scoring for What to Wear. Reads run artifacts (JSONL) produced by the main package and scores them via the Vercel AI Gateway."
requires-python = ">=3.12"
# Isolated from the main package: the vibrantlabs Ragas fork pins
# langchain-community==0.3.31 (imports a legacy Vertex AI module removed in 0.4),
# which conflicts with the retrieval layer's langchain-cohere>=0.4. This project
# never imports the retrieval stack — it only reads JSONL and scores.
dependencies = [
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
    "instructor>=1.15.0,<2.0.0",
    "openai>=2.0.0,<3.0.0",
    "openevals>=0.2.0,<0.3.0",
    "langsmith>=0.8.0,<0.9.0",
    "langchain>=1.3.0,<2.0.0",
    "langchain-community==0.3.31",
    "langchain-openai>=1.2.0,<2.0.0",
    "ragas @ git+https://github.com/vibrantlabsai/ragas.git@298b68274234c060deacab3cf5fb52aa3a20e885",
    "rapidfuzz>=3.14.0,<4.0.0",
    "pandas>=2.2.0,<4.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
]

[tool.uv]
package = false
