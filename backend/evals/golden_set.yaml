  - id: g22
    occasion: date
    mood: cozy
    temp_c: 9
    expected: {min_formality: smart_casual, requires_outer: true}
    relevant_rule_ids: [L4-occ-date, L4-dc-smartcasual, L4-wx-cold]
    reference: "A cozy cold date: smart-casual knit layers with a coat, dark denim or trousers."

  - id: g23
    occasion: brunch
    mood: chic
    temp_c: 16
    formality: smart_casual
    expected: {min_formality: smart_casual}
    # L3-2025-quiet-luxury dropped (Feature 007 Task B, research.md D7): see
    # g12's note -- L3 is now live, so this static id can't recur.
    relevant_rule_ids: [L4-dc-smartcasual, L4-wx-cool]
    reference: "A chic brunch look: understated quality smart-casual basics in neutral tones with a light layer."

  - id: g24
