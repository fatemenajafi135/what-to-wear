# Vision golden set (Feature 003: mvp-app, US2) — a separate, independent
# section from `cases:` above (photo -> attributes is structurally a
# different shape than occasion/mood/weather -> outfit; see
# specs/003-mvp-app/research.md item 6). LOOSE expected properties, not exact
# matches -- extraction is inherently less precise than a hard constraint
# check. Checked by `eval/vision_harness.py`, NOT the existing harness.py
# no-regression gate.
#
# See data/fixtures/vision_samples/README.md: the two sample images below are
# synthetic solid-color placeholders, not real garment photos -- replace them
# before trusting this check for anything real.
vision_cases:
  - id: v01
    image: fixtures/vision_samples/navy_top_placeholder.png
    expected:
      category: top
      formality_in: [casual, smart_casual, business_casual]
      warmth_range: [0, 3]

  - id: v02
    image: fixtures/vision_samples/beige_trousers_placeholder.png
    expected:
      category: bottom
      formality_in: [casual, smart_casual, business_casual, semi_formal]
      warmth_range: [0, 3]
