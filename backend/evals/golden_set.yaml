    # see g12's note -- L3 is now live, so this static id can't recur.
    relevant_rule_ids: [L4-dc-smartcasual, L4-wx-mild]
    reference: "A creative-office smart-casual look with relaxed tailored trousers and a fitted top."

  - id: g17
    occasion: wedding
    mood: classic
    temp_c: -1
    expected: {min_formality: formal, requires_outer: true, forbid_colors: [white, ivory]}
    relevant_rule_ids: [L4-occ-wedding-evening, L4-dc-formal, L4-wx-freezing]
    reference: "A freezing evening wedding: a formal dress or suit with a warm coat, not white."

  - id: g18
    occasion: interview
    mood: prepared
    temp_c: 22
    formality: business_casual
    expected: {min_formality: business_casual, max_warmth: 3}
    relevant_rule_ids: [L4-dc-businesscasual, L4-wx-mild]
    reference: "A warm-day interview: crisp business-casual, conservative colors, well-fitted."

  - id: g19
    occasion: party
    mood: festive
    temp_c: 2
    formality: semi_formal
