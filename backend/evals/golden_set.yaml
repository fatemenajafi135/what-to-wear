    relevant_rule_ids: [L4-dc-semiformal, L4-wx-cold]
    reference: "A cold evening party: semi-formal dressy separates with a warm coat over them."

  - id: g20
    occasion: beach
    mood: easy
    temp_c: 27
    expected: {min_formality: casual, max_warmth: 1, forbid_categories: [suit, gown, outerwear]}
    relevant_rule_ids: [L4-occ-beach, L4-dc-casual, L4-wx-warm]
    reference: "A warm beach look: light casual pieces and sandals."

  - id: g21
