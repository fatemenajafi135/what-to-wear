[project]
name = "whattowear"
version = "0.1.0"
description = "What to Wear — backend and database foundation (feature 002)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "pyjwt[crypto]>=2.9.0,<3.0.0",
    # --- AI layer (feature 007) — core RAG/LLM, via Vercel AI Gateway ---
    "pydantic>=2.0.0,<3.0.0",
    "langchain>=1.3.0,<2.0.0",
    "langchain-community>=0.4.0,<1.0.0",
    "langchain-openai>=1.2.0,<2.0.0",
    "langchain-qdrant>=1.0.0,<2.0.0",
    "langchain-text-splitters>=1.0.0,<2.0.0",
    "langchain-cohere>=0.4.0,<1.0.0",
    "langchain-tavily>=0.2.0,<1.0.0",
    "langchain-experimental>=0.3.0,<1.0.0",
    "langchain-litellm>=0.2.0,<1.0.0",
    "litellm>=1.60.0,<2.0.0",
    "tiktoken>=0.8.0,<1.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "qdrant-client>=1.15.0,<2.0.0",
    "openai>=2.0.0,<3.0.0",
    "langsmith>=0.8.0,<0.9.0",
    "psycopg-pool>=3.2.0,<4.0.0",
    # --- AI layer — ingestion ---
    "wikipedia>=1.4.0,<2.0.0",
    "ebooklib>=0.18,<1.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "markdownify>=0.13.0,<1.0.0",
    "pyyaml>=6.0,<7.0.0",
    # --- AI layer — external APIs ---
    "requests>=2.32.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "import-linter>=2.1,<3.0.0",
    "pre-commit>=4.0.0,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whattowear"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# psycopg3's type stubs are incomplete for some driver-level connect_args keys.
module = "psycopg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# No py.typed marker / stub package published for these (feature 007's
# ingest/ package: markdownify wraps wiki_refine.py's HTML->MD conversion,
# ebooklib parses the two public-domain EPUB sources).
module = ["markdownify.*", "ebooklib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
