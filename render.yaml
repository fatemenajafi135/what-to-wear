services:
  - type: web
    name: w2w-backend-staging
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        scope: "secret"
      - key: DATABASE_URL_DIRECT
        scope: "secret"
      - key: SUPABASE_URL
        scope: "secret"
      - key: SUPABASE_JWT_AUD
        value: "authenticated"
      - key: WTW_CHECKPOINTER_MODE
        value: "postgres"
      - key: LOG_LEVEL
        value: "INFO"
      - key: ENVIRONMENT
        value: "staging"
      - key: AI_GATEWAY_API_KEY
        scope: "secret"
      - key: WTW_QDRANT_URL
        scope: "secret"
      - key: WTW_QDRANT_API_KEY
        scope: "secret"
      - key: WTW_CORS_ORIGINS
        value: "https://w2w-staging.vercel.app"
