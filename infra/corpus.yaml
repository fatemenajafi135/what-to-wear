    notes: "Includes rules distilled REFERENCE-ONLY from Dressing the Man & The Curated Closet."

  # book sources kept for provenance ONLY - never raw-ingested
  - name: "Dressing the Man (Flusser)"
    layer: L1
    status: have
    license: copyrighted
    loader: reference_only
    path: "books/Alan Flusser - Dressing the Man_ Mastering the Art of Permanent Fashion (2002, HarperCollins).pdf"
    url: "reference-only://dressing-the-man"
    ingest: false
    sha256: null
    notes: "REFERENCE-ONLY. Distilled into l1_rules.jsonl. Text never stored. File itself absent from the local corpus checkout (inventory §5) — ingest:false means this is never read regardless."

  - name: "The Curated Closet (Rees)"
