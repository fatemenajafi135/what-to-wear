# What to Wear — knowledge-base source registry (constitution Principle X).
#
# `ingest/cli.py` reads this and ingests every source with `ingest: true`,
# resolving every `path` relative to `$CORPUS_LOCAL_DIR` (never a path inside
# this repo, never an absolute path or `~`). `sha256` is populated by the CLI
# on first run and checked on every later run — a source whose hash hasn't
# changed is not re-embedded (idempotent by content hash).
#
# Translated from the prototype's data/kb/manifest.yaml (docs/legacy-ai-
# inventory.md §5), field vocabulary and per-file licence policy carried
# forward unchanged: only `path` changed (repo-relative "data/..." -> corpus-
# root-relative, since $CORPUS_LOCAL_DIR IS the data root here) and `sha256`
# was added.
#
# status:  have | fetch | distill | want-later
#   have        - file already present locally (see path)
#   fetch       - pulled live at build time (Wikipedia, uncached)
#   distill     - our own/authored or LLM-distilled cards stored as jsonl
#   want-later  - logged, NOT ingested this phase (acquisition pending)
# license: PD | CC-BY-SA | own | copyrighted
# chunker: atomic (one rule/concept per chunk) | section (long articles)
#
# Legal policy: PD + CC-BY-SA + own + API data are ingestable. Copyrighted
# books are REFERENCE-ONLY: a human/LLM distills rules in our own words into
# jsonl cards; the book text itself is never stored -> ingest: false on the
# book, ingest: true on the distilled card file.

sources:
  # ---------------- L1 Static (harmony / proportion) ----------------
  - name: "Wikipedia: Color theory"
    layer: L1
    status: have
    license: CC-BY-SA
    loader: wiki_md
    path: "wikipedia/Color theory - Wikipedia.md"
    url: "https://en.wikipedia.org/wiki/Color_theory"
    chunker: section
    chunker_options: {}
    ingest: true
    sha256: null

  - name: "Wikipedia: Color harmony"
